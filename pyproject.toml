[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmbatdesk"
version = "1.2.3"
description = "Windows manager for existing local-LLM BAT and CMD startup scripts"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "PySide6>=6.8,<7",
]

[project.gui-scripts]
llmbatdesk = "llmbatdesk.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
